<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>Hollowblade</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Hollowblade game"></canvas>
      <section id="hud" aria-live="polite">
        <div class="hud-row">
          <div class="health-panel">
            <span class="hud-label">VITALITY</span>
            <div class="health-track"><div id="health-fill"></div></div>
          </div>
          <div class="wave-panel">
            <span class="hud-label">WAVE</span>
            <strong id="wave-value">1</strong>
          </div>
          <div class="score-panel">
            <span class="hud-label">SCORE</span>
            <strong id="score-value">0</strong>
          </div>
        </div>
        <div id="combo-value" class="combo-value">COMBO x0</div>
        <p id="controls-hint">A / ← attack left &nbsp; · &nbsp; D / → attack right</p>
      </section>
      <section id="game-over" class="overlay hidden">
        <p class="eyebrow">THE SHADOWS CLAIM YOU</p>
        <h1>HOLLOWBLADE</h1>
        <p>Score <strong id="final-score">0</strong></p>
        <button id="restart-button" type="button">RISE AGAIN</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
