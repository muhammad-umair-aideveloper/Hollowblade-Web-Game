<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>Hollowblade</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Hollowblade game"></canvas>
      <section id="hud" aria-live="polite">
        <div class="hud-row">
          <div class="health-panel">
            <span class="hud-label">VITALITY</span>
            <div class="health-track"><div id="health-fill"></div></div>
          </div>
          <div class="wave-panel">
            <span class="hud-label">WAVE</span>
            <strong id="wave-value">1</strong>
          </div>
          <div class="score-panel">
            <span class="hud-label">SCORE</span>
            <strong id="score-value">0</strong>
          </div>
        </div>
        <div id="combo-value" class="combo-value">COMBO x0</div>
        <p id="controls-hint">
          A / ← attack left &nbsp; · &nbsp; D / → attack right &nbsp; · &nbsp; Q / E / R abilities
        </p>
      </section>
      <nav id="touch-controls" aria-label="Touch attack controls">
        <button class="attack-button" data-direction="left" type="button" aria-label="Attack left">
          ◀
        </button>
        <button class="attack-button" data-direction="right" type="button" aria-label="Attack right">
          ▶
        </button>
      </nav>
      <section id="game-over" class="overlay hidden">
        <p class="eyebrow">THE SHADOWS CLAIM YOU</p>
        <h1>HOLLOWBLADE</h1>
        <p>Score <strong id="final-score">0</strong></p>
        <p class="currency-line">SHARDS <strong id="currency-value">0</strong></p>
        <div id="shop" class="shop">
          <p class="shop-title">CHOOSE YOUR EDGE</p>
          <div id="upgrade-list" class="upgrade-list"></div>
          <p class="shop-title">UNLOCK ABILITIES</p>
          <div id="ability-list" class="ability-list"></div>
        </div>
        <button id="restart-button" type="button">RISE AGAIN</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
