<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollow Blade</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050914;color:#d9faff;font:14px system-ui, sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:#050914}#title{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#101d39aa,#03060dcc);z-index:4}#box{text-align:center;width:min(420px,90vw);padding:36px;border:1px solid #6be4ff55;background:#071022dd;box-shadow:0 0 60px #28d7ff22}h1{margin:0 0 4px;letter-spacing:12px;font-weight:300;color:#eafcff;text-shadow:0 0 18px #64eaff}p{color:#8aa3b5;margin:6px 0 22px}input,button{width:100%;padding:13px;border:1px solid #65eaff77;background:#09172a;color:#eaffff;font:inherit}button{margin-top:10px;cursor:pointer;background:#12344b}button:hover{background:#1b5165}#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:none;text-shadow:0 2px 3px #000}.top{display:flex;justify-content:space-between}.hp{color:#f4ffff;font-size:23px;letter-spacing:4px}.soul{width:180px;height:10px;border:1px solid #9defff;margin-top:8px}.soul i{display:block;height:100%;width:0;background:#9df8ff;box-shadow:0 0 12px #61eaff}.board{position:fixed;right:18px;top:55px;min-width:145px;color:#a6bbc9}.board b{color:#fff}.hint{position:fixed;bottom:15px;left:18px;color:#75909e;font-size:12px}.respawn{position:fixed;inset:0;display:grid;place-items:center;font-size:25px;color:#d8faff}</style></head><body><canvas id="c"></canvas><div id="title"><div id="box"><h1>HOLLOW BLADE</h1><p>Enter the abyss. Outlive the dark.</p><input id="name" maxlength="16" placeholder="Wanderer"><button id="join">ENTER THE ARENA</button></div></div><div id="hud"><div class="top"><div><div id="hp" class="hp"></div><div class="soul"><i id="soul"></i></div></div><div id="count"></div></div><div id="board" class="board"></div><div class="hint">A/D move · W/Space jump · S fast-fall · J/click slash · Shift/K dash · hold H heal</div><div id="respawn" class="respawn"></div></div><script src="/socket.io/socket.io.js"></script><script>
const cv=document.querySelector("#c"),x=cv.getContext("2d"),title=document.querySelector("#title"),hud=document.querySelector("#hud"),nameEl=document.querySelector("#name"),join=document.querySelector("#join"),hpEl=document.querySelector("#hp"),soulEl=document.querySelector("#soul"),countEl=document.querySelector("#count"),boardEl=document.querySelector("#board"),respawnEl=document.querySelector("#respawn");let S,me,keys={},snap=[],prev=[],particles=[],slashes=[],shake=0,last=performance.now(),mouse=false;
const socket=io(),lerp=(a,b,t)=>a+(b-a)*t,resize=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)},key=e=>{keys[e.key.toLowerCase()]=e.type==="keydown";if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault()};addEventListener("resize",resize);addEventListener("keydown",key);addEventListener("keyup",key);resize();
join.onclick=()=>{socket.emit("join",nameEl.value);title.style.display="none";hud.style.display="block"};nameEl.onkeydown=e=>{if(e.key==="Enter")join.click()};addEventListener("mousedown",()=>mouse=true);addEventListener("mouseup",()=>mouse=false);
socket.on("init",v=>S=v);socket.on("joined",p=>me=p);socket.on("state",v=>{prev=snap;snap=v.players;if(me){let q=snap.find(a=>a.id===me.id);if(q)me={...me,...q}}});socket.on("hit",v=>{shake=8;slashes.push({x:v.x,y:v.y,t:.22});for(let i=0;i<16;i++)particles.push({x:v.x,y:v.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.8)*300,t:.5,c:"#dff"});});
function input(){let left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,face=right?1:left?-1:(me?.face||1),attack=keys.j||mouse,dash=keys.shift||keys.k,jump=keys.w||keys.arrowup||keys[" "];return{left,right,down:keys.s||keys.arrowdown,jump,attack,attackType:keys.s?2:keys.w||keys.arrowup?1:0,face,heal:keys.h,dash,dashDir:face}}let sent={};
setInterval(()=>{if(!me)return;let i=input(),jump=i.jump,attack=i.attack;i.jump=jump&&!sent.jump?1:0;i.attack=attack&&!sent.attack?1:0;sent={jump,attack};socket.emit("input",i)},1000/60);
function world(){return{sx:innerWidth/2-(me?.x||640),sy:innerHeight*.72-(me?.y||650)}}function draw(){
 let t=performance.now(),dt=Math.min(.04,(t-last)/1000);last=t;let w=world();x.clearRect(0,0,innerWidth,innerHeight);let g=x.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,"#050817");g.addColorStop(1,"#0b1830");x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;
 if(S){for(let i=0;i<30;i++){let px=(i*173%1280)+w.sx,py=(i*91%600)+w.sy;x.fillStyle=i%3?"#182b4a":"#284a66";x.fillRect(px,py,2,2)}for(const r of S.platforms){x.fillStyle="#18253b";x.fillRect(r.x+w.sx,r.y+w.sy,r.w,r.h);x.strokeStyle="#42647b";x.strokeRect(r.x+w.sx,r.y+w.sy,r.w,r.h);for(let z=r.x+15;z<r.x+r.w;z+=34){x.strokeStyle="#223c54";x.beginPath();x.moveTo(z+w.sx,r.y+w.sy);x.lineTo(z-12+w.sx,r.y+r.h+w.sy);x.stroke()}}
  for(const p of snap){let q=p.id===me?.id?me:p,a=p.id===me?.id?1:.18;let old=prev.find(z=>z.id===p.id)||p,px=lerp(old.x,q.x,a)+w.sx,py=lerp(old.y,q.y,a)+w.sy;if(q.dead)continue;drawPlayer(px,py,q,p.id===me?.id);if(q.attack>0)drawSlash(px,py,q)}
 }x.restore();particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.t-=dt;x.globalAlpha=Math.max(0,p.t*2);x.fillStyle=p.c;x.fillRect(p.x+w.sx,p.y+w.sy,3,3)});x.globalAlpha=1;particles=particles.filter(p=>p.t>0);slashes=slashes.filter(a=>a.t>0);slashes.forEach(a=>a.t-=dt);if(me){hpEl.textContent="⬡".repeat(me.hp)+"◇".repeat(5-me.hp);soulEl.style.width=me.soul+"%";respawnEl.textContent=me.dead?"RETURNING IN "+Math.ceil(me.dead):me.channel?"CHANNELING SOUL":"";countEl.textContent="SURVIVORS "+snap.filter(p=>!p.dead).length;boardEl.innerHTML="<b>LEADERBOARD</b><br>"+[...snap].sort((a,b)=>b.kills-a.kills).map(p=>`${p.name} ${p.kills}/${p.deaths}`).join("<br>")}requestAnimationFrame(draw)}
function drawPlayer(px,py,p,local){x.save();x.translate(px,py);x.globalAlpha=p.dead?0.25:1;x.fillStyle="#07101d";x.beginPath();x.moveTo(-20,0);x.quadraticCurveTo(-35,20,-28,45);x.lineTo(28,45);x.quadraticCurveTo(35,20,20,0);x.fill();x.fillStyle=local?"#a8f8ff":"#b9dbe5";x.beginPath();x.arc(0,-45,17,0,Math.PI*2);x.fill();x.fillStyle="#081323";x.beginPath();x.moveTo(-18,-45);x.lineTo(-27,-62);x.lineTo(-8,-53);x.moveTo(18,-45);x.lineTo(27,-62);x.lineTo(8,-53);x.fill();x.fillStyle="#dfffff";x.fillRect(-8,-45,4,5);x.fillRect(4,-45,4,5);x.restore()}
function drawSlash(px,py,p){if(p.attack<=0)return;x.save();x.translate(px,py-45);x.rotate(p.face<0?Math.PI:0);x.strokeStyle="#f5ffff";x.lineWidth=5;x.shadowBlur=15;x.shadowColor="#bfffff";x.beginPath();x.arc(0,0,55,-.8,.7);x.stroke();x.restore()}requestAnimationFrame(draw);
</script></body></html>
